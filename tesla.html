<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis · Tesla</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #e2e8f0;
         font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 20px; box-sizing: border-box; }
  p { max-width: 520px; text-align: center; }
</style>
</head>
<body>
<p id="m">Conectando el Powerwall con Jarvis…</p>
<script>
  // Tesla manda aquí al terminar el permiso; esta página se lo pasa a Jarvis en tu propia PC.
  const q = location.search;
  if (/[?&](code|error)=/.test(q)) location.replace("http://127.0.0.1:8889/tesla" + q);
  else document.getElementById("m").textContent = "Esta página solo la usa Jarvis, el asistente de José, para conectar su Powerwall.";
</script>
</body>
</html>
